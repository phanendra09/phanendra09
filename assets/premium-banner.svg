<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2CC60" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="50%" stop-color="#121826" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#58A6FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8957E5" stop-opacity="1" />
      <stop offset="70%" stop-color="#F2CC60" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F2CC60" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)" rx="16" />

  <!-- Grid lines -->
  <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 200 0 L 200 300 M 400 0 L 400 300 M 600 0 L 600 300 M 800 0 L 800 300 M 1000 0 L 1000 300" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />

  <!-- Background Glows -->
  <circle cx="300" cy="150" r="350" fill="url(#glow)" />
  <circle cx="900" cy="100" r="300" fill="url(#glow)" />
  
  <!-- Transit Light Curve -->
  <path d="M 0 100 Q 200 100 400 100 C 500 100 550 220 600 220 C 650 220 700 100 800 100 Q 1000 100 1200 100" fill="none" stroke="url(#curveGrad)" stroke-width="3" />
  
  <!-- Star and Planet in Transit -->
  <circle cx="600" cy="80" r="60" fill="url(#starGlow)" />
  <circle cx="600" cy="80" r="20" fill="#FFFBEA" opacity="0.9" />
  
  <!-- Planet -->
  <circle cx="585" cy="88" r="8" fill="#0D1117" />
  
  <!-- Data points on curve -->
  <circle cx="350" cy="100" r="3" fill="#58A6FF" />
  <circle cx="450" cy="106" r="3" fill="#58A6FF" />
  <circle cx="500" cy="130" r="3" fill="#8957E5" />
  <circle cx="550" cy="200" r="3" fill="#8957E5" />
  <circle cx="600" cy="220" r="4" fill="#F2CC60" />
  <circle cx="650" cy="200" r="3" fill="#F2CC60" />
  <circle cx="700" cy="130" r="3" fill="#8957E5" />
  <circle cx="750" cy="106" r="3" fill="#58A6FF" />
  <circle cx="850" cy="100" r="3" fill="#58A6FF" />

  <!-- Decorative technical lines -->
  <path d="M 600 80 L 600 220" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="4 4" stroke-width="1" />
  <text x="610" y="215" font-family="'Courier New', monospace" font-size="10" fill="#F2CC60" opacity="0.6">ΔF/F</text>
  <text x="565" y="65" font-family="'Courier New', monospace" font-size="10" fill="#FFFFFF" opacity="0.4">M-Dwarf</text>

  <!-- Random Stars -->
  <circle cx="150" cy="80" r="1.5" fill="#FFFFFF" opacity="0.6" />
  <circle cx="280" cy="220" r="1" fill="#FFFFFF" opacity="0.4" />
  <circle cx="410" cy="50" r="2" fill="#58A6FF" opacity="0.8" />
  <circle cx="720" cy="260" r="1.5" fill="#FFFFFF" opacity="0.5" />
  <circle cx="890" cy="180" r="1" fill="#FFFFFF" opacity="0.7" />
  <circle cx="1050" cy="90" r="2" fill="#F2CC60" opacity="0.6" />
  <circle cx="1120" cy="210" r="1" fill="#FFFFFF" opacity="0.4" />
  <circle cx="80" cy="270" r="1.2" fill="#8957E5" opacity="0.5" />
  <circle cx="50" cy="40" r="1" fill="#FFFFFF" opacity="0.3" />
  <circle cx="980" cy="250" r="1.5" fill="#58A6FF" opacity="0.5" />
  <circle cx="780" cy="40" r="1" fill="#F2CC60" opacity="0.4" />
</svg>
