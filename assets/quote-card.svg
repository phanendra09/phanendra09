<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="160" viewBox="0 0 800 160" fill="none">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#8957E5;stop-opacity:0.10" />
      <stop offset="100%" style="stop-color:#F2CC60;stop-opacity:0.08" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58A6FF" />
      <stop offset="50%" style="stop-color:#8957E5" />
      <stop offset="100%" style="stop-color:#F2CC60" />
    </linearGradient>
  </defs>
  <rect width="800" height="160" rx="16" fill="url(#headerGrad)" stroke="url(#textGrad)" stroke-width="1" stroke-opacity="0.3" />
  
  <!-- Stars (static) -->
  <circle cx="50" cy="30" r="1" fill="#58A6FF" opacity="0.6" />
  <circle cx="150" cy="60" r="0.8" fill="#F2CC60" opacity="0.5" />
  <circle cx="700" cy="40" r="1.2" fill="#8957E5" opacity="0.7" />
  <circle cx="600" cy="120" r="0.7" fill="#58A6FF" opacity="0.4" />
  <circle cx="300" cy="25" r="0.9" fill="#F2CC60" opacity="0.6" />
  <circle cx="750" cy="90" r="1" fill="#58A6FF" opacity="0.3" />
  <circle cx="400" cy="140" r="0.6" fill="#8957E5" opacity="0.5" />
  <circle cx="100" cy="110" r="0.8" fill="#F2CC60" opacity="0.4" />
  
  <!-- Orbit rings (static) -->
  <ellipse cx="400" cy="80" rx="120" ry="35" fill="none" stroke="#58A6FF" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 6" />
  <ellipse cx="400" cy="80" rx="180" ry="50" fill="none" stroke="#8957E5" stroke-width="0.5" stroke-opacity="0.1" stroke-dasharray="3 8" />
  
  <!-- Quote text -->
  <text x="400" y="65" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8B949E" text-anchor="middle" font-style="italic">"Prefer public archives and reproducible scripts</text>
  <text x="400" y="85" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8B949E" text-anchor="middle" font-style="italic">over hand-curated results."</text>
  <text x="400" y="115" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#8957E5" text-anchor="middle">— Research Philosophy —</text>
</svg>
